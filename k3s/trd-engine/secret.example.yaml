# Template only — DO NOT put real values in this file, it is committed.
#
# Create the real secret imperatively so the token never touches git:
#
#   kubectl create secret generic trd-engine-telegram \
#     --namespace trd \
#     --from-literal=TELEGRAM_BOT_TOKEN='123456:ABC-your-bot-token' \
#     --from-literal=TELEGRAM_CHAT_ID='-1001234567890'
#
# See k3s/trd-engine/README.md ("Telegram feed") for how to obtain both values,
# including the channel-vs-direct-message difference that trips people up.
#
# The engine treats notification as optional: with no secret, scans still run and
# only log a warning. Nothing about trading depends on the chat.
apiVersion: v1
kind: Secret
metadata:
  name: trd-engine-telegram
  namespace: trd
type: Opaque
stringData:
  TELEGRAM_BOT_TOKEN: "REPLACE_ME"
  TELEGRAM_CHAT_ID: "REPLACE_ME"
