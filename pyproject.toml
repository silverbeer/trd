[project]
name = "trd"
version = "0.1.0"
license = { file = "LICENSE" }
description = "Local-first investment tracker: portfolio, watchlists, indicators, simulation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.10",
    "duckdb>=1.2",
    "yfinance>=0.2.54",
    "lxml>=6.1.1",
]

# The judgement half of the decision review, and the only part of trd that talks
# to a model. Optional on purpose: the engine, the scan CronJob and every read
# command must stay installable — and testable — on a machine with no API key and
# no network, and the scan image should not grow an LLM SDK to place a trade.
[project.optional-dependencies]
ai = ["pydantic-ai-slim[anthropic]>=2.40"]

[project.scripts]
trd = "trd.cli.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.9",
    "ty",
    # In dev, not in the runtime install: the review agent's tests must run in CI,
    # and they run against pydantic-ai's own test models — never a provider.
    "pydantic-ai-slim[anthropic]>=2.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trd"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Indicator classes assign ClassVar attrs declared on the base; ruff can't see the
# inherited annotation and flags every dict/list as a mutable class default.
"src/trd/indicators/library.py" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
