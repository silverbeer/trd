name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest

  # The repo is public: no real account data in the tree, the PR text or the
  # branch name (SB-1421, docs/privacy.md). stdlib only — runs before uv sync.
  # PR fields reach the shell through env, never ${{ }} inside `run:`, so a
  # crafted title cannot inject a command.
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan every tracked file
        run: python3 scripts/privacy_scan.py --tree
      - name: Scan the PR title, body and branch name
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          status=0
          printf '%s\n' "$PR_TITLE" | python3 scripts/privacy_scan.py --text --label "PR title" || status=1
          printf '%s\n' "$PR_BODY" | python3 scripts/privacy_scan.py --text --label "PR body" || status=1
          printf '%s\n' "$PR_BRANCH" | python3 scripts/privacy_scan.py --text --label "branch" || status=1
          exit $status
